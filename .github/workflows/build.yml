name: build-android-arm64

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*' # Triggers release on tags starting with 'v'
  pull_request:
  workflow_dispatch:
    inputs:
      manual:
        description: Manual run
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  android-arm64:
    # Updated repository check to your specific fork
    if: inputs.manual || (github.repository == 'ProstheticDOS/rclone' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name))
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '~1.26.0'

      - name: Set global environment variables
        run: |
          echo "VERSION=$(make version)" >> $GITHUB_ENV
          echo "RCLONE_NDK_VERSION=21" >> $GITHUB_ENV

      - name: arm64-v8a Set environment variables
        run: |
          echo "CC=$(echo $ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${RCLONE_NDK_VERSION}-clang)" >> $GITHUB_ENV
          echo "CC_FOR_TARGET=$CC" >> $GITHUB_ENV
          echo 'GOOS=android' >> $GITHUB_ENV
          echo 'GOARCH=arm64' >> $GITHUB_ENV
          echo 'CGO_ENABLED=1' >> $GITHUB_ENV
          echo 'CGO_LDFLAGS=-fuse-ld=lld -s -w' >> $GITHUB_ENV

      - name: arm64-v8a build
        run: |
          mkdir -p build
          go build -v -tags android -trimpath -ldflags "-s -X github.com/rclone/rclone/fs.Version=${VERSION}" -o build/rclone-android-${RCLONE_NDK_VERSION}-armv8a .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        # Only creates the release if a tag was pushed
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/rclone-android-${{ env.RCLONE_NDK_VERSION }}-armv8a
          tag_name: ${{ github.ref_name }}
          name: rclone Android Arm64 ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
